<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skill Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #191919;
    --accent: #0E7490;
    --neg: #7C3AED;
    --font: 'Space Grotesk', system-ui, sans-serif;
    --ink: #E8E8E6;
    --muted: #9A9A97;
    --surface: #2F2F2F;
    --surface-2: #252525;
    --line: #373737;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 14px;
    --pad: 22px;
  }
  /* Notion light override */
  html[data-theme="notion-light"] {
    --bg: #FFFFFF;
    --ink: #1A1A1A;
    --muted: #9B9B9B;
    --surface: #FFFFFF;
    --surface-2: #F7F6F3;
    --line: #E9E9E7;
  }
  html[data-density="compact"] { --pad: 14px; }
  html[data-density="comfy"] { --pad: 30px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  #root { min-height: 100%; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }

  .app { max-width: 1240px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 80px; position: relative; }

  /* topbar */
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
  .title { font-size: clamp(28px, 4vw, 40px); font-weight: 700; letter-spacing: -0.02em; margin: 0; cursor: text; line-height: 1.05; }
  .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 14px; font-weight: 500; }
  .actions { display: flex; gap: 8px; }
  .ghost {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 9px 15px; border-radius: 9px; font-size: 13px; font-weight: 600;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .ghost:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .ghost:active { transform: translateY(1px); }
  .ghost.danger:hover { border-color: #c2410c; color: #c2410c; }

  /* layout */
  .layout { display: grid; grid-template-columns: minmax(380px, 500px) 1fr; gap: 30px; align-items: start; }
  .layout.noradar { grid-template-columns: 1fr; }
  @media (max-width: 1080px) { .layout { grid-template-columns: 1fr; } }

  /* viz column */
  .viz { position: sticky; top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--pad); }
  @media (max-width: 1080px) { .viz { position: static; } }

  .balancecard { display: flex; align-items: center; gap: 18px; padding-bottom: 18px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
  .bal-row { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
  .bal-row b { color: var(--ink); font-family: var(--mono); margin-left: auto; }
  .bal-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .bal-dot.pos { background: var(--accent); }
  .bal-dot.neg { background: var(--neg); }
  .bal-share { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 6px; }
  .lvl-ring {
    --pct: 0; width: 84px; height: 84px; border-radius: 50%; flex: none;
    background: conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--neg) 0);
    display: grid; place-items: center; transition: background .4s ease;
  }
  .lvl-inner { width: 66px; height: 66px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; line-height: 1; }
  .lvl-kick { font-size: 9px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
  .lvl-big { font-family: var(--mono); font-size: 26px; font-weight: 700; }
  .lvl-meta { flex: 1; }
  .xp { font-family: var(--mono); font-size: 20px; font-weight: 700; }
  .tonext { font-size: 12px; color: var(--muted); margin: 2px 0 8px; font-weight: 500; }
  .mini-track { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .mini-track span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }

  .radar { width: 100%; max-width: 500px; height: auto; display: block; margin: 4px auto; overflow: visible; }
  .radar-label { font-family: var(--font); font-size: 11px; font-weight: 600; fill: var(--ink); }
  .radar-val { font-family: var(--mono); font-size: 10px; font-weight: 700; fill: var(--accent); }
  .group-label { font-family: var(--font); font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .hint { font-size: 11.5px; color: var(--muted); text-align: center; margin: 6px 6px 0; line-height: 1.4; }

  /* viz quick-controls */
  .viz-controls { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .vc-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .vc-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
  .vc-pills { display: flex; gap: 4px; }
  .vc-pill { height: 28px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-family: var(--mono); font-size: 12px; font-weight: 700; transition: border-color .15s, background .15s, color .15s; white-space: nowrap; }
  .vc-pill:hover { border-color: var(--accent); color: var(--ink); }
  .vc-pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .board { display: flex; flex-direction: column; gap: 18px; }
  .cat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--pad); }
  .cat-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .cat-sum { font-family: var(--mono); font-size: 12px; font-weight: 700; margin-left: 2px; }
  .cat-title { background: none; border: none; padding: 0; font-family: inherit; font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .cat-count { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; }
  .cat-del { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 600; opacity: 0; transition: opacity .15s, color .15s; }
  .cat:hover .cat-del { opacity: 1; }
  .cat-del:hover { color: #c2410c; }

  .skills { display: flex; flex-direction: column; }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .srow:first-child { border-top: none; }
  .srow-main { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1 1 180px; }
  .sname { background: none; border: none; padding: 0; font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .sname:hover { color: var(--accent); }
  .tier { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; flex: none; }

  /* stage milestone blocks */
  .stage { display: flex; gap: 3px; flex: none; }
  .sblk { width: 14px; height: 20px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface-2); transition: background .3s ease; }
  .sblk.on { border-color: transparent; }

  .srow-ctrl { display: flex; align-items: center; gap: 12px; flex: none; }

  /* progress: cycles toward next stage + points toward next cycle */
  .prog { display: flex; flex-direction: column; gap: 4px; width: 132px; }
  html[data-density="compact"] .prog { width: 112px; }
  .prog-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .cyc-lbl { font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .pnum { background: none; border: none; padding: 0; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--ink); }
  .pnum:hover { color: var(--accent); }
  .pden { color: var(--muted); font-weight: 500; font-size: 9px; }
  .pin { width: 46px; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--ink); background: var(--surface-2); border: 1px solid var(--accent); border-radius: 5px; padding: 2px 4px; outline: none; text-align: right; }
  .pbar { position: relative; height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
  .pfill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; transition: width .35s ease; }
  .cycles { display: flex; gap: 2px; }
  .pip { flex: 1; height: 4px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); transition: background .3s ease; }
  .pip.on { border-color: transparent; }

  .steppers { display: flex; align-items: center; gap: 5px; }
  .step { height: 30px; min-width: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--mono); font-size: 13px; font-weight: 700; line-height: 1; display: grid; place-items: center; transition: transform .1s, border-color .15s, background .15s; }
  .step:hover:not(:disabled) { border-color: var(--accent); }
  .step.up:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
  .step:active:not(:disabled) { transform: scale(.9); }
  .step:disabled { opacity: .35; cursor: not-allowed; }
  .remove { width: 24px; height: 24px; border-radius: 6px; border: none; background: none; color: var(--muted); font-size: 18px; line-height: 1; opacity: 0; transition: opacity .15s, color .15s; }
  .srow:hover .remove { opacity: 1; }
  .remove:hover { color: #c2410c; }

  .rename { font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--accent); border-radius: 7px; padding: 5px 9px; outline: none; min-width: 0; }
  .cat-rename { font-size: 17px; font-weight: 700; }
  .title-rename { font-size: clamp(28px, 4vw, 40px); font-weight: 700; letter-spacing: -0.02em; padding: 2px 8px; }

  .add-row, .add-cat { background: none; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; font-weight: 600; padding: 9px; border-radius: 9px; transition: border-color .15s, color .15s; }
  .add-row { margin-top: 10px; width: 100%; }
  .add-row:hover, .add-cat:hover { border-color: var(--accent); color: var(--accent); }
  .add-cats { display: flex; gap: 10px; }
  .add-cat { flex: 1; padding: 14px; }
  .addskill { margin-top: 10px; }
  .addskill .rename { width: 100%; }

  /* floats + celebrate */
  .floats { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  .float { position: absolute; font-family: var(--mono); font-weight: 700; font-size: 16px; animation: floatup .9s ease-out forwards; white-space: nowrap; }
  .float.big { font-size: 20px; letter-spacing: .02em; animation: floatup 1.1s ease-out forwards; }
  @keyframes floatup { 0% { opacity: 0; transform: translateY(0) scale(.7); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-52px) scale(1.15); } }

  .celebrate { position: fixed; inset: 0; display: grid; place-items: center; z-index: 70; pointer-events: none; background: color-mix(in srgb, var(--bg) 55%, transparent); animation: fadein .25s ease; }
  .celebrate-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 34px 52px; display: grid; justify-items: center; gap: 4px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.4); animation: pop .5s cubic-bezier(.2,1.3,.4,1); border-top: 4px solid var(--ce, var(--accent)); }
  .ce-kicker { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .2em; color: var(--ce, var(--accent)); }
  .ce-num { font-size: 46px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; text-align: center; }
  .ce-sub { font-size: 13px; color: var(--muted); font-weight: 500; }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/data.js"></script>
<script type="text/babel" src="app/tweaks-panel.jsx"></script>
<script type="text/babel" src="app/RadarChart.jsx"></script>
<script type="text/babel" src="app/main.jsx"></script>
</body>
</html>
